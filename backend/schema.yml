  /api/weatherdata/:
    get:
      operationId: weatherdata_list
      description: |-
        API endpoint that allows weather data to be viewed.
        Provides filtering by station name and timestamp.

        Examples:
        /api/weatherdata/?station__name=HXC
        /api/weatherdata/?timestamp=2026-02-08T21:30:00Z
      parameters:
      - in: query
        name: station__name
        schema:
          type: string
      - in: query
        name: timestamp
        schema:
          type: string
          format: date-time
      tags:
      - weatherdata
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeatherData'
          description: ''
  /api/weatherdata/{id}/:
    get:
      operationId: weatherdata_retrieve
      description: |-
        API endpoint that allows weather data to be viewed.
        Provides filtering by station name and timestamp.

        Examples:
        /api/weatherdata/?station__name=HXC
        /api/weatherdata/?timestamp=2026-02-08T21:30:00Z
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this weather data.
        required: true
      tags:
      - weatherdata
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherData'
          description: ''
components:
  schemas:
    HydrologyForecastDaily:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        station:
          type: string
          readOnly: true
        target_date:
          type: string
          format: date
          title: 预测日期
        flow_avg:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          title: 日均流量
        model_name:
          type: string
          title: 模型名称
          maxLength: 100
        model_version:
          type: string
          title: 模型版本
          maxLength: 100
        run_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - created_at
      - flow_avg
      - id
      - model_name
      - model_version
      - run_id
      - station
      - target_date
    HydrologyForecastRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        run_id:
          type: string
          title: 运行编号
          maxLength: 64
        target_date:
          type: string
          format: date
          title: 预测日期
        model_name:
          type: string
          title: 模型名称
          maxLength: 100
        model_version:
          type: string
          title: 模型版本
          maxLength: 100
        source:
          type: string
          title: 触发来源
          maxLength: 30
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: 运行状态
        retry_count:
          type: integer
          maximum: 32767
          minimum: 0
          title: 重试次数
        record_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: 结果条数
        error_message:
          type: string
          title: 错误信息
        triggered_by:
          type: string
          readOnly: true
        started_at:
          type: string
          format: date-time
          title: 开始时间
        finished_at:
          type: string
          format: date-time
          nullable: true
          title: 结束时间
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
      required:
      - created_at
      - id
      - run_id
      - target_date
      - triggered_by
      - updated_at
    HydrologyForecastRunTrigger:
      type: object
      properties:
        target_date:
          type: string
          format: date
      required:
      - target_date
    ManualDataRecord:
      type: object
      description: 序列化 ManualDataRecord 模型
      properties:
        id:
          type: integer
          readOnly: true
        operator:
          type: string
          readOnly: true
        operated_at:
          type: string
          format: date-time
          readOnly: true
        data_at:
          type: string
          format: date-time
          title: 数据时间
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          title: 数据值
        is_void:
          type: boolean
          readOnly: true
        voided_at:
          type: string
          format: date-time
          readOnly: true
        voided_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - data_at
      - id
      - is_void
      - operated_at
      - operator
      - updated_at
      - value
      - voided_at
      - voided_by
    Station:
      type: object
      description: 序列化 Station 模型
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    StatusEnum:
      enum:
      - running
      - success
      - failed
      type: string
      description: |-
        * `running` - 运行中
        * `success` - 成功
        * `failed` - 失败
    WeatherData:
      type: object
      description: 序列化 WeatherData 模型
      properties:
        id:
          type: integer
          readOnly: true
        station:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
          title: 数据存储时间
        record:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          title: 记录号
        batt_volt:
          type: number
          format: double
          nullable: true
          title: 数采电池电压
        ptemp:
          type: number
          format: double
          nullable: true
          title: 数采面板温度
        ws:
