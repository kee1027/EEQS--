paths:
  /api/hydrology-forecast-daily/:
    get:
      operationId: hydrology_forecast_daily_list
      parameters:
      - in: query
        name: model_name
        schema:
          type: string
      - in: query
        name: model_version
        schema:
          type: string
      - in: query
        name: run__run_id
        schema:
          type: string
      - in: query
        name: station__name
        schema:
          type: string
      - in: query
        name: target_date
        schema:
          type: string
          format: date
      tags:
      - hydrology-forecast-daily
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HydrologyForecastDaily'
          description: ''
  /api/hydrology-forecast-daily/{id}/:
    get:
      operationId: hydrology_forecast_daily_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this hydrology forecast daily.
        required: true
      tags:
      - hydrology-forecast-daily
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HydrologyForecastDaily'
          description: ''
  /api/hydrology-runs/:
    get:
      operationId: hydrology_runs_list
      parameters:
      - in: query
        name: model_name
        schema:
          type: string
      - in: query
        name: model_version
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: 运行状态
          enum:
          - failed
          - running
          - success
        description: |-
          * `running` - 运行中
          * `success` - 成功
          * `failed` - 失败
      - in: query
        name: target_date
        schema:
          type: string
          format: date
      tags:
      - hydrology-runs
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HydrologyForecastRun'
          description: ''
    post:
      operationId: hydrology_runs_create
      tags:
      - hydrology-runs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HydrologyForecastRunTrigger'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HydrologyForecastRunTrigger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HydrologyForecastRunTrigger'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HydrologyForecastRunTrigger'
          description: ''
  /api/hydrology-runs/{id}/:
    get:
      operationId: hydrology_runs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this hydrology forecast run.
        required: true
      tags:
      - hydrology-runs
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HydrologyForecastRun'
          description: ''
  /api/manual-data/:
